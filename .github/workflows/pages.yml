name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'server/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Test frontend
        run: npm run test
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Test server
        run: npm --prefix server test
      - name: Check formatting
        run: npm run format:check
      - name: Build and smoke-test connected container
        run: |
          docker build --tag riftwell-ci .
          trap 'docker rm --force --volumes riftwell-check >/dev/null 2>&1 || true' EXIT
          docker run --detach --name riftwell-check --publish 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 --mount type=volume,dst=/var/lib/riftwell \
            --env APP_ORIGIN=https://riftwell.invalid \
            --env SESSION_SECRET="$(openssl rand -hex 32)" \
            --env HYPEREVM_RPC_URL=https://rpc.hyperliquid.xyz/evm riftwell-ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/status | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(v.mode!=='connected'||v.settlementEnabled!==false)process.exit(1)})"
          docker restart riftwell-check
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health/live
      - name: Build Pages frontend
        run: npm run build -- --base=/Riftwell/
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
